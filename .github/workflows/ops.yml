name: Ops

# دیباگ سرور بدون SSH. سشن این را با GitHub MCP اجرا می‌کند و خروجی را از لاگ جاب می‌خواند.
# قواعد امنیتی (بند ۷ PLATFORM.md):
#  - ورودی کاربر هرگز در shell یا SQL جاسازی نمی‌شود؛ همیشه از راه env می‌آید.
#  - نام اپ از ورودی گرفته نمی‌شود؛ فقط اپ‌های خودِ این پروژه ری‌استارت می‌شوند.
#  - db-query فقط‌خواندنی است.

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options:
          [
            ssh-check,
            status,
            logs,
            errors,
            restart,
            env-check,
            bots-env-check,
            db-query,
            admin-list,
            admin-add,
            admin-remove,
            bot-check,
          ]
        required: true
      lines:
        description: "تعداد خطوط لاگ"
        default: "100"
      query:
        description: "db-query: فقط SELECT"
        default: ""
      telegram_id:
        description: "admin-add / admin-remove: آی‌دی عددی تلگرام"
        default: ""

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      # تشخیص اتصال، روی خودِ رانر — نه روی سرور، چون وقتی لازم است که اتصال کار نمی‌کند.
      # مقدار کلید هرگز چاپ نمی‌شود؛ فقط طول، نوع، و اثر انگشتِ عمومی که اطلاعات محرمانه نیست.
      - name: ssh-check
        if: inputs.action == 'ssh-check'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set +e
          echo "── سکرت ──"
          if [ -z "$SSH_KEY" ]; then
            echo "VPS_SSH_KEY: ❌ ست نشده یا خالی است"
            exit 1
          fi
          echo "VPS_SSH_KEY: ✅ ست شده ($(printf '%s' "$SSH_KEY" | wc -c) بایت، $(printf '%s\n' "$SSH_KEY" | wc -l) خط)"
          case "$SSH_KEY" in
            "-----BEGIN OPENSSH PRIVATE KEY-----"*) echo "قالب: OpenSSH (ed25519 یا rsa جدید)" ;;
            "-----BEGIN RSA PRIVATE KEY-----"*)     echo "قالب: PEM RSA (قدیمی)" ;;
            "-----BEGIN EC PRIVATE KEY-----"*)      echo "قالب: PEM EC" ;;
            "-----BEGIN "*)                         echo "قالب: PEM ناشناخته" ;;
            "ssh-"*|"ecdsa-"*)                      echo "قالب: ❌ این کلیدِ عمومی است، نه خصوصی" ;;
            *) echo "قالب: ❌ با -----BEGIN شروع نمی‌شود — احتمالاً بریده یا اشتباه چسبانده شده" ;;
          esac

          umask 077
          printf '%s\n' "$SSH_KEY" > /tmp/k
          echo
          echo "── کلید ──"
          if PUB=$(ssh-keygen -y -P '' -f /tmp/k 2>/tmp/kerr); then
            echo "پارس شد: ✅"
            echo "نوع و اثر انگشت (عمومی، محرمانه نیست):"
            printf '%s\n' "$PUB" > /tmp/k.pub
            ssh-keygen -l -f /tmp/k.pub
            echo
            echo "نصفِ عمومی همین کلید — عمومی است و چاپش خطری ندارد."
            echo "اگر بخواهید سرور این کلید را بپذیرد، همین خط باید در"
            echo "~/.ssh/authorized_keys کاربر ubuntu باشد:"
            echo "-----8<-----"
            printf '%s\n' "$PUB"
            echo "----->8-----"
          else
            echo "پارس شد: ❌"
            head -5 /tmp/kerr
            echo "(اگر گفته passphrase لازم است، یعنی کلید رمز دارد و برای Actions باید نسخه‌ی بدون رمز ساخته شود)"
          fi

          echo
          echo "── سرور ──"
          if ssh-keyscan -T 10 185.204.171.170 2>/dev/null | head -1 | grep -q .; then
            echo "پورت ۲۲: ✅ باز و پاسخ‌گو"
          else
            echo "پورت ۲۲: ❌ از رانرِ گیت‌هاب در دسترس نیست"
          fi

          echo
          echo "── اتصال واقعی ──"
          OUT=$(ssh -i /tmp/k -o BatchMode=yes -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
                    ubuntu@185.204.171.170 'echo CONNECTED; whoami; hostname' 2>&1)
          RC=$?
          rm -f /tmp/k /tmp/k.pub /tmp/kerr
          printf '%s\n' "$OUT" | grep -v 'Warning: Permanently added'
          if [ $RC -eq 0 ]; then
            echo "نتیجه: ✅ اتصال برقرار است — بقیه‌ی اکشن‌های Ops هم کار می‌کنند"
          else
            echo "نتیجه: ❌ سرور کلید را نپذیرفت"
            echo "یعنی کلید سالم است ولی در authorized_keys کاربر ubuntu نیست:"
            echo "همان مقداری که در Secrets ریپوی مونوریپو هست باید عیناً اینجا هم گذاشته شود."
            exit 1
          fi

      - uses: appleboy/ssh-action@v1
        if: inputs.action != 'ssh-check'
        env:
          OPS_ACTION: ${{ inputs.action }}
          OPS_LINES: ${{ inputs.lines }}
          OPS_QUERY: ${{ inputs.query }}
          OPS_TGID: ${{ inputs.telegram_id }}
          PROJ: arayeshgar
        with:
          host: 185.204.171.170
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          # قاعده‌ی ۵ بند ۵: هرچه اسکریپت می‌خواند باید اینجا هم باشد وگرنه خالی می‌رسد
          envs: OPS_ACTION,OPS_LINES,OPS_QUERY,OPS_TGID,PROJ
          script: |
            set -e
            case "$OPS_LINES" in (*[!0-9]*|'') OPS_LINES=100;; esac
            export DB_PATH="$HOME/$PROJ/data/$PROJ.db"
            APP_WEB="$PROJ-web"
            APP_BOTS="$PROJ-bots"
            DIR="$HOME/$PROJ"
            # مسیر صریح لاگ‌ها؛ منبعِ واحدش `ecosystem.config.cjs` است. قبلاً هر اکشن
            # `~/.pm2/logs/<name>-out.log` را حدس می‌زد و آن حدس قابل تأیید نبود.
            LOGS="$DIR/data/logs"

            case "$OPS_ACTION" in
              status)
                echo "── محیط ──"
                echo "node:  $(node -v 2>/dev/null || echo 'نصب نیست')"
                echo "npm:   $(npm -v 2>/dev/null || echo '-')"
                echo "pnpm:  $(pnpm -v 2>/dev/null || echo 'نصب نیست')"
                echo "sqlite3: $(sqlite3 --version 2>/dev/null || echo 'نصب نیست')"
                echo "cloudflared: $(cloudflared --version 2>/dev/null || echo 'نصب نیست')"
                echo "python3: $(python3 --version 2>/dev/null || echo '-')"
                echo
                echo "── لینک دمو ──"
                # آدرس quick tunnel با هر ری‌استارت cloudflared عوض می‌شود، پس همیشه از
                # لاگِ زنده خوانده می‌شود نه از فایلی که ممکن است کهنه باشد.
                LIVE="$(grep -ohE 'https://[a-z0-9-]+\.trycloudflare\.com' \
                        $LOGS/tunnel-*.log 2>/dev/null | tail -1)"
                # ‏`|| true` اینجا لازم است، نه محتاطانه: `cat` روی فایلِ نبوده ۱ برمی‌گرداند
                # و با `set -e` بالای همین اسکریپت، کلِ `Ops → status` همان‌جا می‌مرد. در
                # اولین دیپلوی واقعی دقیقاً همین شد — تنها ابزار تشخیصِ بی‌SSH، درست وقتی
                # لینک دمو وجود نداشت، خودش هم از کار افتاد.
                SAVED="$(cat "$DIR/data/demo-url.txt" 2>/dev/null || true)"
                if [ -n "$LIVE" ]; then
                  echo "🔗 $LIVE"
                  [ -n "$SAVED" ] && [ "$SAVED" != "$LIVE" ] \
                    && echo "   (آدرسِ ذخیره‌شده کهنه است — تونل از دیپلوی تا حالا ری‌استارت شده)"
                elif [ -n "$SAVED" ]; then
                  echo "🔗 $SAVED  ← ذخیره‌شده؛ تونل الان بالا نیست پس ممکن است کار نکند"
                else
                  echo "⬜ لینکی نیست (تونل هنوز بالا نیامده)"
                fi
                # وقتی لینکی نیست، سؤال بعدی همیشه «pm2 کجا می‌نویسد؟» است. یک بار بدون
                # جواب ماند و دیپلوی را کور کرد، پس حالا همیشه چاپ می‌شود.
                echo "فایل‌های لاگ:"
                if [ -d "$LOGS" ]; then
                  ls -l "$LOGS" 2>/dev/null | tail -n +2 | awk '{printf "  %-22s %8s بایت\n", $NF, $5}'
                else
                  echo "  ⬜ $LOGS وجود ندارد (دیپلوی بعدی می‌سازدش)"
                fi
                echo
                echo "── پروژه ──"
                if [ -d "$DIR" ]; then
                  echo "پوشه: ✅ $DIR"
                  ls -la "$DIR" | head -20
                else
                  echo "پوشه: ⬜ هنوز ساخته نشده (اولین دیپلوی می‌سازدش)"
                fi
                echo
                echo "── اپ‌های pm2 (کلِ سرور) ──"
                pm2 ls || echo "pm2 در دسترس نیست"
                echo
                systemctl list-unit-files 2>/dev/null | grep -q '^pm2-ubuntu' \
                  && echo "pm2 startup: ✅ بعد از ری‌بوت بالا می‌آید" \
                  || echo "pm2 startup: ❌ بعد از ری‌بوت بالا نمی‌آید"
                echo
                echo "── تصادم نام و پورت ──"
                for a in "$APP_WEB" "$APP_BOTS"; do
                  if pm2 jlist 2>/dev/null | grep -q "\"name\":\"$a\""; then
                    echo "نام «$a»: قبلاً وجود دارد (مالِ همین پروژه)"
                  else
                    echo "نام «$a»: آزاد ✅"
                  fi
                done
                if ss -ltn 2>/dev/null | grep -q ':8800 '; then
                  echo "پورت 8800: ❌ اشغال است"
                else
                  echo "پورت 8800: آزاد ✅"
                fi
                echo
                echo "── دیسک ──"
                df -h / | tail -1
                echo
                # این سرور ۱ گیگ رم دارد و چند محصول دیگر رویش زنده‌اند، پس عدد حافظه
                # همان‌قدر مهم است که دیسک: سقف max_memory_restart ما باید قبل از اینکه
                # کرنل مجبور شود اپ کسی دیگر را بکشد فعال شود.
                echo "── حافظه ──"
                free -m | sed -n '1,3p'
                echo
                echo "مجموع حافظه‌ی اپ‌های pm2:"
                pm2 jlist 2>/dev/null | python3 -c '
            import json, sys
            try:
                apps = json.load(sys.stdin)
            except Exception:
                print("  (pm2 jlist خوانده نشد)"); raise SystemExit(0)
            total = 0
            for a in apps:
                mem = (a.get("monit") or {}).get("memory") or 0
                total += mem
                print("  %-18s %6.1f MB" % (a.get("name", "?"), mem / 1048576))
            print("  %-18s %6.1f MB" % ("— جمع", total / 1048576))
            '
                ;;

              logs)
                # تونل هم هست: لاگش تنها جایی است که آدرس دمو در آن نوشته می‌شود.
                # گلاب چون pm2 این سرور آی‌دی پروسه را به نام فایل می‌چسباند
                for a in web bots tunnel; do
                  echo "════ $a ════"
                  found=""
                  for f in $LOGS/$a-*.log; do
                    [ -f "$f" ] || continue
                    found=yes
                    echo "──── $(basename "$f") ────"
                    tail -n "$OPS_LINES" "$f" 2>/dev/null
                  done
                  [ -n "$found" ] || echo "(خالی)"
                done
                ;;

              errors)
                for a in web bots tunnel; do
                  echo "════ $a ════"
                  found=""
                  for f in $LOGS/$a-error*.log; do
                    [ -f "$f" ] || continue
                    found=yes
                    tail -n "$OPS_LINES" "$f" 2>/dev/null
                  done
                  [ -n "$found" ] || echo "(خالی)"
                done
                ;;

              restart)
                # فقط اپ‌های این پروژه — نام هرگز از ورودی نمی‌آید
                pm2 restart "$APP_WEB" --update-env 2>/dev/null || echo "$APP_WEB بالا نبود"
                pm2 restart "$APP_BOTS" --update-env 2>/dev/null || echo "$APP_BOTS بالا نبود"
                # تونل عمداً ری‌استارت *نمی‌شود*: هر ری‌استارتش آدرس دمو را عوض می‌کند، و
                # کسی که «ری‌استارت» می‌زند معمولاً دنبال مرگِ لینکش نیست.
                echo "(تونل دست‌نخورده ماند تا لینک دمو عوض نشود — برای ری‌استارتش از پنل pm2 استفاده کنید)"
                sleep 3
                pm2 ls
                echo
                echo "لینک دمو بعد از ری‌استارت:"
                grep -ohE 'https://[a-z0-9-]+\.trycloudflare\.com' \
                  $LOGS/tunnel-*.log 2>/dev/null | tail -1 \
                  || echo "(پیدا نشد)"
                ;;

              env-check)
                # فقط وجودِ فایل — هرگز محتوا
                [ -f "$DIR/.env" ] && echo ".env ✅ موجود ($(wc -l < "$DIR/.env") خط)" || echo ".env ❌ نیست"
                [ -f "$DIR/data/$PROJ.db" ] && echo "دیتابیس ✅ ($(du -h "$DIR/data/$PROJ.db" | cut -f1))" || echo "دیتابیس ⬜ هنوز ساخته نشده"
                [ -d "$DIR/data/uploads" ] && echo "آپلودها ✅ ($(find "$DIR/data/uploads" -type f 2>/dev/null | wc -l) فایل)" || echo "آپلودها ⬜"
                ;;

              bots-env-check)
                # چرا این اکشن وجود دارد: ربات دمو ساکت است — نه لاگِ «initialized»، نه
                # لاگِ خطا، هیچ. .env روی دیسک توکن دارد (bot-check همین را با curl ثابت
                # کرد) و ADMIN_IDS مسلماً به پروسه رسیده (ensurePlatformAdmins رویش کار
                # کرده)، ولی هیچ‌کدام از این دو ثابت نمی‌کند DEMO_TELEGRAM_BOT_TOKEN هم
                # رسیده — فقط *فرضش* را قوی‌تر می‌کند. اینجا از خودِ کرنل می‌پرسد:
                # /proc/<pid>/environ محیط واقعیِ همان پروسه‌ی زنده است، نه چیزی که فایل
                # یا pm2 *ادعا* می‌کنند. فقط وجودِ کلید چاپ می‌شود، هرگز مقدارش.
                PID="$(pm2 jlist 2>/dev/null | python3 -c '
            import json, sys
            apps = json.load(sys.stdin)
            for a in apps:
                if a.get("name") == "arayeshgar-bots":
                    print(a.get("pid") or "")
                    break
            ')"
                if [ -z "$PID" ]; then
                  echo "❌ arayeshgar-bots بالا نیست، pid پیدا نشد"
                  exit 1
                fi
                echo "pid زنده: $PID"
                if [ ! -r "/proc/$PID/environ" ]; then
                  echo "❌ /proc/$PID/environ خوانده نشد"
                  exit 1
                fi
                for k in DEMO_TELEGRAM_BOT_TOKEN DEMO_BALE_BOT_TOKEN ADMIN_IDS BOT_TRANSPORT DATABASE_URL; do
                  if tr '\0' '\n' < "/proc/$PID/environ" | grep -q "^$k="; then
                    echo "  $k: ✅ در محیط واقعیِ پروسه هست"
                  else
                    echo "  $k: ❌ در محیط واقعیِ پروسه نیست"
                  fi
                done
                ;;

              db-query)
                [ -n "$OPS_QUERY" ] || { echo "❌ query لازم است"; exit 1; }
                cd "$DIR"
                # python3 و ماژول sqlite3ِ استانداردش روی سرور هست؛ better-sqlite3 نیست و
                # هرگز نصب نمی‌شود (ما libsql را می‌فرستیم) — این اکشن قبلاً همین‌جا می‌شکست.
                # mode=ro نوشتن را در سطح خود SQLite رد می‌کند، و کوئری از env می‌آید نه
                # جاسازی در SQL یا shell.
                python3 - <<'PY' 2>&1
            import json, os, sqlite3
            con = sqlite3.connect("file:%s?mode=ro" % os.environ["DB_PATH"], uri=True, timeout=5)
            con.row_factory = sqlite3.Row
            try:
                rows = con.execute(os.environ["OPS_QUERY"]).fetchall()
            except sqlite3.Error as e:
                print("❌ خطای SQL:", e); raise SystemExit(1)
            print("rows:", len(rows))
            for r in rows[:200]:
                print(json.dumps({k: r[k] for k in r.keys()}, ensure_ascii=False, default=str))
            PY
                ;;

              admin-list)
                cd "$DIR"
                python3 - <<'PY' 2>&1
            import json, os, sqlite3
            con = sqlite3.connect("file:%s?mode=ro" % os.environ["DB_PATH"], uri=True, timeout=5)
            con.row_factory = sqlite3.Row
            rows = con.execute(
                "SELECT id, username, display_name, telegram_chat_id, bale_chat_id, is_active "
                "FROM users WHERE role = ? AND tenant_id IS NULL", ("platform_admin",)
            ).fetchall()
            print("ادمین‌های پلتفرم:", len(rows))
            for r in rows:
                print(json.dumps({k: r[k] for k in r.keys()}, ensure_ascii=False, default=str))
            PY
                ;;

              admin-add|admin-remove)
                case "$OPS_TGID" in
                  ''|*[!0-9]*) echo "❌ آی‌دی تلگرام باید فقط عدد باشد"; exit 1;;
                esac
                cd "$DIR"
                # ورودی از env می‌آید و بایند می‌شود، نه جاسازی در SQL.
                # اپ زنده هم ممکن است هم‌زمان بنویسد، پس busy_timeout لازم است.
                python3 - <<'PY' 2>&1
            import os, sqlite3, time, uuid
            con = sqlite3.connect(os.environ["DB_PATH"], timeout=5, isolation_level=None)
            con.execute("PRAGMA busy_timeout = 5000")
            tg = int(os.environ["OPS_TGID"])
            add = os.environ["OPS_ACTION"] == "admin-add"
            now = int(time.time())
            con.execute("BEGIN IMMEDIATE")
            row = con.execute("SELECT id, username FROM users WHERE telegram_chat_id = ?", (tg,)).fetchone()
            if add:
                if row:
                    con.execute("UPDATE users SET role = ?, tenant_id = NULL, is_active = 1 WHERE id = ?",
                                ("platform_admin", row[0]))
                    print("✅ به ادمین پلتفرم ارتقا یافت:", row[1])
                    target = row[0]
                else:
                    target = str(uuid.uuid4())
                    con.execute(
                        "INSERT INTO users (id, tenant_id, role, username, password_hash, display_name,"
                        " telegram_chat_id, is_active, created_at) VALUES (?, NULL, ?, ?, ?, ?, ?, 1, ?)",
                        (target, "platform_admin", "tg%d" % tg, "", "ادمین %d" % tg, tg, now))
                    print("✅ ادمین جدید ساخته شد برای آی‌دی", tg)
                    print("   (دسترسی ربات همین حالا فعال است؛ برای ورود به پنل وب رمز لازم دارد)")
            else:
                if not row:
                    con.execute("ROLLBACK"); print("این آی‌دی ادمین نبود:", tg); raise SystemExit(0)
                con.execute("UPDATE users SET is_active = 0, bot_link_code = NULL,"
                            " bot_link_code_expires_at = NULL WHERE id = ?", (row[0],))
                print("✅ غیرفعال شد:", row[1])
                target = row[0]
            con.execute(
                "INSERT INTO audit_log (id, tenant_id, actor_type, actor_id, action, entity, entity_id,"
                " data, created_at) VALUES (?, NULL, ?, ?, ?, ?, ?, ?, ?)",
                (str(uuid.uuid4()), "system", "ops-workflow", os.environ["OPS_ACTION"],
                 "platform_admin", str(target), '{"via":"ops"}', now))
            con.execute("COMMIT")
            PY
                ;;

              bot-check)
                # **چرا این اکشن وجود دارد.** اولین هشدار تلگرامی هرگز نرسید، ولی دیپلوی
                # گفت «هشدار فرستاده شد» — چون آن استپ `curl ... -o /dev/null || true` بود
                # و جوابِ تلگرام را نگاه نمی‌کرد. سه حالت ممکن است و از بیرون قابل تفکیک
                # نیستند: توکن باطل · آی‌دی غلط · **یا (شایع‌ترین) کاربر هرگز ربات را
                # /start نکرده** — تلگرام اجازه نمی‌دهد ربات اول پیام بدهد و ۴۰۳ می‌دهد.
                # این اکشن هر سه را از هم جدا می‌کند و **هیچ‌وقت مقدار توکن را چاپ نمی‌کند.**
                set -a; . "$DIR/.env"; set +a
                [ -n "${DEMO_TELEGRAM_BOT_TOKEN:-}" ] \
                  && echo "توکن: ✅ ست شده (${#DEMO_TELEGRAM_BOT_TOKEN} کاراکتر — مقدارش چاپ نمی‌شود)" \
                  || { echo "توکن: ❌ خالی است ⇒ سکرت ARAYESHGAR_DEMO_BOT_TOKEN را بگذارید"; exit 1; }
                echo "ADMIN_IDS: ${ADMIN_IDS:-(خالی)}"
                echo
                echo "── ربات کیست؟ (getMe) ──"
                TG="https://api.telegram.org/bot$DEMO_TELEGRAM_BOT_TOKEN"
                curl -s -m 20 "$TG/getMe" | python3 -c '
            import json, sys
            try:
                d = json.load(sys.stdin)
            except Exception:
                print("  ❌ جواب تلگرام خوانده نشد (شاید شبکه)"); raise SystemExit(0)
            if not d.get("ok"):
                print("  ❌ توکن رد شد:", d.get("description"))
                print("     ⇒ توکن باطل است. از BotFather یکی تازه بگیرید.")
                raise SystemExit(0)
            r = d["result"]
            print("  ✅ @%s  (نام: %s · id: %s)" % (r.get("username"), r.get("first_name"), r.get("id")))
            print("  لینک ربات: https://t.me/%s" % r.get("username"))
            '
                echo
                echo "── آیا ربات می‌تواند به ادمین پیام بدهد؟ ──"
                # هر آی‌دی جدا؛ فقط عددها. پیام واقعی فرستاده می‌شود چون تنها راه قطعیِ
                # فهمیدنِ «۴۰۳: کاربر ربات را start نکرده» همین است.
                for id in $(printf '%s' "${ADMIN_IDS:-}" | tr ',' ' '); do
                  case "$id" in (*[!0-9-]*|'') echo "  ⏭️  «$id» عدد نیست، رد شد"; continue;; esac
                  RESP="$(curl -s -m 20 -G "$TG/sendMessage" \
                          --data-urlencode "chat_id=$id" \
                          --data-urlencode "text=✅ تست اتصال آرایشگر — اگر این را می‌بینید، ربات می‌تواند به شما پیام بدهد." 2>/dev/null)"
                  printf '%s' "$RESP" | OPS_ID="$id" python3 -c '
            import json, os, sys
            i = os.environ["OPS_ID"]
            try:
                d = json.load(sys.stdin)
            except Exception:
                print("  %s: ❌ جواب خوانده نشد" % i); raise SystemExit(0)
            if d.get("ok"):
                print("  %s: ✅ پیام رفت — تلگرام این آی‌دی باز است" % i); raise SystemExit(0)
            code, desc = d.get("error_code"), (d.get("description") or "")
            print("  %s: ❌ %s — %s" % (i, code, desc))
            low = desc.lower()
            # Matched on "initiate conversation" rather than stripping the apostrophe out of
            # "cant" -- that stripping needed a literal apostrophe character inside a body
            # that is itself wrapped in python3 -c followed by an apostrophe ... apostrophe
            # for the shell, which closed the shell string early and corrupted everything
            # after it: this ran, produced a Python SyntaxError, and the step exited 1. Every
            # apostrophe in this whole block, comments included, is banned for the same
            # reason -- the shell scans for the closing quote character by character and does
            # not know Python comments exist. "initiate conversation" appears in the Telegram
            # error text regardless of which apostrophe form it uses, so no apostrophe of any
            # kind is needed here at all.
            if "initiate conversation" in low:
                print("     ⇒ **آی‌دی درست است ولی شما هنوز ربات را start نکرده‌اید.**")
                print("        ربات را در تلگرام باز کنید و یک بار Start بزنید. تمام.")
            elif "chat not found" in low:
                print("     ⇒ این آی‌دی برای تلگرام وجود ندارد ⇒ OWNER_TELEGRAM_ID غلط است.")
                print("        آی‌دی عددی را از @userinfobot بگیرید (نه یوزرنیم).")
            elif "blocked" in low:
                print("     ⇒ شما ربات را بلاک کرده‌اید؛ آنبلاک کنید.")
            elif "deactivated" in low:
                print("     ⇒ حساب غیرفعال است.")
            '
                done
                echo
                echo "── چه کسی رسیدِ رزرو را می‌گیرد؟ ──"
                # خودِ همان کوئریِ `adminRecipients`: مستاجر + نقش + چتِ وصل‌شده.
                python3 - <<'PY' 2>&1
            import os, sqlite3
            con = sqlite3.connect("file:%s?mode=ro" % os.environ["DB_PATH"], uri=True)
            rows = con.execute(
                "SELECT t.slug, u.role, u.username, u.telegram_chat_id, u.is_active"
                " FROM users u LEFT JOIN tenants t ON t.id = u.tenant_id"
                " ORDER BY u.tenant_id IS NULL, t.slug, u.role").fetchall()
            if not rows:
                print("  (هیچ کاربری نیست)")
            for slug, role, uname, tg, active in rows:
                mark = "✅" if (slug and role in ("owner", "manager") and tg and active) else "⬜"
                print("  %s مستاجر=%-8s نقش=%-15s کاربر=%-10s چت‌تلگرام=%s" %
                      (mark, slug or "(پلتفرم)", role, uname, tg if tg else "وصل نیست"))
            print()
            print("  ✅ = این ردیف رسید می‌گیرد. اگر هیچ ✅ نیست، رزروِ دمو به هیچ تلگرامی نمی‌رود.")
            PY
                ;;

            esac
